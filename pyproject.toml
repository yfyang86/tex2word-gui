[project]
name = "tex2word-web"
version = "0.1.1"
description = "Web workspace for converting LaTeX to Microsoft Word with tex2word."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Yifan Yang", email = "yfyang.86@hotmail.com" }
]
maintainers = [
    { name = "Yifan Yang", email = "yfyang.86@hotmail.com" }
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = [
    "tex2word>=1.0.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "latex2mathml>=3.77",
    "anthropic>=0.40",
    "openai>=1.40",
    "mistune>=3.0",
    "citeproc-py>=0.6",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx2>=2.4",
]
# PDF/EPS figure rasterisation for the preview (pypdfium2 via tex2word).
# TikZ figures additionally need a TeX engine (xelatex/pdflatex) on PATH.
pdf = [
    "tex2word[pdf]>=1.0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
