name: CI

# Gate the integration branches: direct pushes to main/dev and any pull request
# targeting them. Contributions are tested before they land in dev, and dev is
# tested again on the way to the main release line.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up the environment
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      - name: Check frontend JS syntax
        run: node --check app/static/app.js

      - name: Run tests
        run: uv run pytest -q
